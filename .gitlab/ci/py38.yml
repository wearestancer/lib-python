
.py38:
  variables:
    PYTHON_VERSION: py38

py38:lint:
  extends:
    - .py38
    - .lint

py38:tests:
  extends:
    - .py38
    - .tests

  needs:
    - py38:lint

py38:coverage-check:
  extends:
    - .py38
    - .coverage-check

py38:update-coverage:
  extends:
    - .py38
    - .update-coverage
