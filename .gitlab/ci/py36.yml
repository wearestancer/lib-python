
.py36:
  variables:
    PYTHON_VERSION: py36

py36:lint:
  extends:
    - .py36
    - .lint

py36:tests:
  extends:
    - .py36
    - .tests

  needs:
    - py36:lint

py36:coverage-check:
  extends:
    - .py36
    - .coverage-check

py36:update-coverage:
  extends:
    - .py36
    - .update-coverage
