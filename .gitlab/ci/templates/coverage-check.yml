
.coverage-check:
  extends:
    - .cache
    - .versions

  stage: coverage

  script:
    - echo '0' >> coverage
    - export saved=`head -n 1 coverage`
    - export coverage=`tox -e $PYTHON_VERSION-unit | grep '^TOTAL ' | sed -E -e 's/\%$//' | awk '{ print $NF * 100 }'`
    - echo $saved $coverage | awk '{ printf "%+10s %.2f%%\n%+10s %.2f%%\n", "expected", $1 / 100, "got", $2 / 100 }'
    - if [ "$coverage" -lt $saved ]; then exit 1; fi

  cache:
    policy: pull

  except:
    - tags
    - develop
    - master
