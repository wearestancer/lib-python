
.coverage-check:
  extends:
    - .cache
    - .versions

  stage: coverage

  script:
    - echo '0' >> coverage
    - export expected=`head -n 1 coverage`
    - export got=`tox -e $PYTHON_VERSION-unit | tee output.txt | grep '^TOTAL ' | sed -E -e 's/\%$//' | awk '{ print $NF * 100 }'`
    - cat output.txt
    - echo $expected $got | awk '{ printf "%+10s %.2f%%\n%+10s %.2f%%\n", "expected", $1 / 100, "got", $2 / 100 }'
    - if [ "$got" -lt $expected ]; then exit 1; fi

  cache:
    policy: pull

  except:
    - tags
    - develop
    - master
