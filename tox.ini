
[tox]
envlist = py{36,37,38,39}-{lint,unit,bandit}

[testenv]
deps = pipenv
passenv = API_KEY API_HOST
setenv =
    PIPENV_VERBOSITY = -1
    REQUESTS_CA_BUNDLE = /etc/ssl/certs/ca-certificates.crt

whitelist_externals =
    /bin/bash
    /usr/bin/bash

commands_pre =
    python --version
    pipenv install --dev --skip-lock

commands =
    bandit: bandit -r iliad_payment -c .bandit.yml
    unit: pytest --cov=iliad_payment --cov-report term --cov-report xml:reports/coverage.xml --junitxml=reports/junit.xml
    lint: bash -c 'pylint --exit-zero  --output-format=pylint2codeclimate.CodeClimateReporter iliad_payment > reports/codeclimate.json'
    lint: pylint --reports=y iliad_payment
