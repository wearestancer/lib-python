
[tox]
envlist = py{27,35,36,37,38}-{lint,unit}

[testenv]
deps = pipenv
passenv = API_KEY API_HOST
setenv =
    PIPENV_VERBOSITY = -1
    REQUESTS_CA_BUNDLE = /etc/ssl/certs/ca-certificates.crt

whitelist_externals =
    /bin/bash
    /bin/mkdir

commands_pre =
    python --version
    pipenv install --dev --skip-lock

commands =
    mkdir -p reports
    unit: pytest --cov=iliad_payment --cov-report term --junitxml=reports/{envname}.xml
    lint: bash -c 'pylint --exit-zero --output-format=junit iliad_payment > reports/{envname}.xml'
    lint: pylint --reports=y iliad_payment
