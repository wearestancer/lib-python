
[tox]
envlist = py{27,35,36,37}, lint

[testenv]
deps = pipenv
passenv = API_KEY API_HOST
setenv =
    PIPENV_VERBOSITY = -1
commands =
    python --version
    pipenv install --dev --skip-lock
    pytest --cov=iliad_payment --cov-report term --junitxml=reports/{envname}-unit.xml

[testenv:lint]
basepython = python3.7
