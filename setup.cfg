
[aliases]
test = pytest

[tool:pytest]
addopts =
    -d
    --tx popen//python=python3.5
    --cov=iliad_payment
    --cov-report term
    --cov-report html:reports/html
    --junitxml=reports/unit.xml

looponfailroots = iliad_payment tests

[pydocstyle]
convention = pep257
add_ignore = D100
match = '(?!tests/*).*\.py'

[pycodestyle]
exclude = .eggs
