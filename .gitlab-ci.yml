
before_script:
  # Show versions
  - python3 --version
  - pip --version
  # Prepare env
  - mkdir env
  - python3 -m venv env
  - source env/bin/activate
  # Install dependencies
  - pip install -r requirements.txt
  - pip install -r requirements-dev.txt

after_script:
  - deactivate

pytest:
  stage: test

  script: pytest

  coverage: '/TOTAL \s+[\d+\s+]* (\d+%)/'

  artifacts:
    reports:
      junit: reports/unit.xml

  tags:
    - python

lint:
  stage: test

  script: pytest --pylint

  artifacts:
    reports:
      junit: reports/unit.xml

  tags:
    - python
