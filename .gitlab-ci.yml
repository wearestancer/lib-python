
stages:
  - lint
  - test
  - coverage

before_script:
  - tox --version
  - pyenv local 2.7.15 3.5.6 3.6.8 3.7.2 3.8-dev
  - export LC_ALL=C.UTF-8 # py35 and py36 was complaining
  - export LANG=C.UTF-8   # py35 and py36 was complaining


.tests:
  stage: test

  script:
    - echo "Running $PYTHON_VERSION"
    - tox -e $PYTHON_VERSION

  coverage: '/TOTAL \s+[\d+\s+]* (\d+%)/'

  artifacts:
    reports:
      junit: reports/$PYTHON_VERSION-unit.xml

  tags:
    - python


.coverage-check:
  stage: coverage

  script:
    - echo "Running $PYTHON_VERSION"
    - echo '0' >> coverage
    - export saved=`head -n 1 coverage`
    - export coverage=`tox -e py35 | grep '^TOTAL ' | sed -E -e 's/\%$//' | awk '{ print $NF * 100 }'`
    - echo $saved $coverage | awk '{ printf "%+10s %.2f%%\n%+10s %.2f%%\n", "expected", $1 / 100, "got", $2 / 100 }'
    - if [ "$coverage" -lt $saved ]; then exit 1; fi

  cache:
    key: "$PYTHON_VERSION"
    paths:
      - coverage

  except:
    - tags
    - master


lint:
  variables:
    PYTHON_VERSION: lint
  extends: .tests
  stage: lint

py27:tests:
  variables:
    PYTHON_VERSION: py27
  extends: .tests

py35:tests:
  variables:
    PYTHON_VERSION: py35
  extends: .tests

py36:tests:
  variables:
    PYTHON_VERSION: py36
  extends: .tests

py37:tests:
  variables:
    PYTHON_VERSION: py37
  extends: .tests

py38:tests:
  variables:
    PYTHON_VERSION: py38
  extends: .tests
  allow_failure: true

py27:coverage:
  variables:
    PYTHON_VERSION: py27
  extends: .coverage-check

py35:coverage:
  variables:
    PYTHON_VERSION: py35
  extends: .coverage-check

py36:coverage:
  variables:
    PYTHON_VERSION: py36
  extends: .coverage-check

py37:coverage:
  variables:
    PYTHON_VERSION: py37
  extends: .coverage-check

py38:coverage:
  variables:
    PYTHON_VERSION: py38
  extends: .coverage-check
  allow_failure: true
